
<!DOCTYPE html>
<html>
<head>
    <title>Edit Document - FileGuard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="mb-3">Edit Document</h2>

        <p class="text-muted">
            Update the document title or upload a replacement file.
        </p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>

            <a href="{% url 'document_list' %}" class="btn btn-secondary ms-2">
                Cancel
            </a>
        </form>

        <a href="{% url 'dashboard' %}" class="mt-3">
            Back to Dashboard
        </a>
    </div>
</div>

</body>
</html>
