
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileGuard | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="#">FileGuard</a>

    <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-light">
            Logout
        </button>
    </form>
</nav>

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h2>Welcome, {{ request.user.username }}!</h2>

            <p class="text-muted">
                Welcome to your secure document management dashboard.
            </p>

            <hr>

            <h5>FileGuard Services</h5>

            <ul>
                <li>Secure document storage</li>
                <li>Document sharing</li>
                <li>Access permission management</li>
                <li>Activity tracking</li>
            </ul>

            <p class="text-success">
                Your account is successfully authenticated.
            </p>
        </div>
    </div>
</div>

</body>
</html>
